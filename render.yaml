services:
  # Node.js Express API Server
  - type: web
    name: snapinsight-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_API_URL
        fromService:
          type: web
          name: snapinsight-analytics
          property: host

  # Python FastAPI Analytics Microservice
  - type: web
    name: snapinsight-analytics
    env: python
    plan: free
    rootDir: analytics
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
